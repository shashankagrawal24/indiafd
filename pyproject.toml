[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "india-fd-rates"
version = "0.1.0"
description = "Weekly fixed deposit interest rates from Indian banks, with a verifiable source link on every row"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
js = ["playwright>=1.44"]
dev = ["pytest>=8.0", "playwright>=1.44"]

[project.scripts]
fdrates = "fdrates.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
