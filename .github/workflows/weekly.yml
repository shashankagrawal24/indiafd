name: Weekly FD rates

on:
  schedule:
    # 01:00 UTC Monday = 06:30 IST Monday
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "Only collect the first N banks (0 = all)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: weekly-fd-rates
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[js]"

      - name: Install headless browser
        # Only two banks render rates client side, but they need a real browser.
        run: python -m playwright install --with-deps chromium

      - name: Collect rates
        id: collect
        run: |
          python -m fdrates run --verbose \
            --limit "${{ github.event.inputs.limit || 0 }}" \
            | tee run.out
          echo "summary=$(head -1 run.out)" >> "$GITHUB_OUTPUT"

      - name: Validate published CSV
        run: python -m fdrates validate data/latest/fd_rates.csv

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest data/history
          if git diff --staged --quiet; then
            echo "no change in rates this week"
          else
            git commit -m "data: ${{ steps.collect.outputs.summary }}"
            git push
          fi

      - name: Job summary
        if: always()
        run: |
          echo "## $(head -1 run.out)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat data/latest/run_report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fd-rates-run
          path: |
            data/latest/
            run.out
          retention-days: 30
